name: Delete gh-pages branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Delete gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/gh-pages" \
            && echo "Deleted gh-pages." \
            || echo "gh-pages does not exist or was already deleted."
